<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-label="stardelt — wordmark, black">
  <title>stardelt</title>
  <desc>stardelt wordmark: the mark followed by the word "stardelt", solid black.</desc>

  <!-- Mark (scaled 0.65, x=10 y=15) -->
  <g transform="translate(10,15) scale(0.65)">
    <polygon points="100,28 178,170 22,170"
             fill="none"
             stroke="#000000"
             stroke-width="11"
             stroke-linejoin="round"
             stroke-linecap="round"/>
    <polygon points="100,92 110,118 138,128 110,138 100,162 90,138 62,128 90,118"
             fill="#000000"/>
  </g>

  <!-- Wordmark -->
  <text x="170" y="108"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="88"
        font-weight="700"
        letter-spacing="-2"
        fill="#000000">stardelt</text>
</svg>
